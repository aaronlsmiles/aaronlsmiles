name: Redraw the profile

# Redraws the desk, the plate and README.md every morning from the studio's Work list (studionephele.com/work.json)
# and GitHub's own record. Triggers: the clock, a button press, and a push that changes the generator. Nothing that
# carries outside input.
#
# Three jobs, least privilege each (the review of 15 Nov 2026):
#   build    runs all the code (the generator, fonttools, brotli) and reads the feed, with a READ-ONLY token
#   publish  runs no project code at all: it lays the build's files over main and pushes them (contents: write)
#   report   opens or comments on one issue when either fails (issues: write)
# So nothing that parses outside data or runs a dependency ever holds a token that can push.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'templates/**'
      - 'config.json'
      - 'fonts/**'

permissions: {}

concurrency:
  group: redraw
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: main
          persist-credentials: false

      # A venv on the runner's own Python 3.12: Ubuntu 24.04 marks the system Python as externally managed.
      - name: Install the pinned dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --require-hashes --only-binary :all: -r tools/requirements.txt

      # `live` only: the masthead, the button and the frames are drawn locally (they need ffmpeg and the site).
      # The token here can read public data (the contribution calendar needs one) and write nothing.
      - name: Redraw
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: '"$RUNNER_TEMP/venv/bin/python" tools/build.py live'

      - name: Hand the drawn files to publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: redraw
          path: |
            README.md
            assets/desk-*.svg
            assets/plate-*.svg
            data/work.json
            data/fetched.txt
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: main
          persist-credentials: true # this job pushes with this token

      - name: Take the drawn files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (node24)
        with:
          name: redraw
          path: .

      # Only the named files are committed, whatever else might have arrived.
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/desk-*.svg assets/plate-*.svg data/work.json data/fetched.txt
          git diff --cached --quiet && exit 0
          git commit -m "Redraw: $(date -u +%Y-%m-%d)"
          # Someone may have pushed while this ran: replay the redraw on top (on a clash the generated files win), try twice.
          for try in 1 2; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 10
          done
          exit 1

  report:
    needs: [build, publish]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Report a failure
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create redraw --color c4922a --description "The daily redraw failed" --force
          open=$(gh issue list --label redraw --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "Redraw failing" --label redraw --body "The daily redraw failed: $RUN_URL"
          fi
