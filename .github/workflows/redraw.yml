name: Redraw the profile

# Redraws the desk, the plate and README.md every morning from the studio's Work list and GitHub's own record.
# Triggers: the clock, a button press, and a push that changes the generator. Nothing that carries outside input.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'templates/**'
      - 'config.json'
      - 'fonts/**'

permissions:
  contents: write
  issues: write

concurrency:
  group: redraw
  cancel-in-progress: false

jobs:
  redraw:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: main # the branch as it is now, not the commit the event fired on
          persist-credentials: true # the commit step pushes with this token

      # A venv on the runner's own Python 3.12: Ubuntu 24.04 marks the system Python as externally managed.
      - name: Install the pinned dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --require-hashes --only-binary :all: -r tools/requirements.txt

      # `live` only: the masthead, the button and the frames are drawn locally (they need ffmpeg and the site).
      - name: Redraw
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: '"$RUNNER_TEMP/venv/bin/python" tools/build.py live'

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add README.md assets data
          git diff --cached --quiet && exit 0
          git commit -m "Redraw: $(date -u +%Y-%m-%d)"
          # Someone may have pushed while this ran: replay the redraw on top (on a clash the generated files win), try twice.
          for try in 1 2; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 10
          done
          exit 1

      - name: Report a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create redraw --color c4922a --description "The daily redraw failed" --force
          open=$(gh issue list --label redraw --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "Redraw failing" --label redraw --body "The daily redraw failed: $RUN_URL"
          fi
